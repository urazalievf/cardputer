; CardputerOS — M5Stack Cardputer (StampS3 / ESP32-S3FN8, 8MB flash)
; Toolchain pinned to the pioarduino fork + IDF 5.5 Arduino libs.

[env:cardputer]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
; The Bruce-firmware libs build that this project started from has
; "# CONFIG_BT_ENABLED is not set" -- Bluetooth is compiled out of it entirely,
; so BLE cannot link. Use the platform's stock libs, which ship BT enabled.
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

build_flags =
    -DARDUINO_M5STACK_CARDPUTER
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Hardware CDC/JTAG bridge. TinyUSB (mode 0) is the only way to present a
    ; mass-storage interface, but with CDC_ON_BOOT the core starts USB before
    ; setup() runs, so MSC registers too late to enumerate -- and esptool can no
    ; longer reset the board, which costs you flashing. See docs/hardware.md.
    -DARDUINO_USB_MODE=1
    -DM5STACK
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DCARDPUTER_OS_VERSION=\"0.2.0\"
    -std=gnu++17
build_unflags = -std=gnu++11

lib_deps =
    m5stack/M5Cardputer@^1.0.3
    m5stack/M5Unified@^0.2.7
    m5stack/M5GFX@^0.2.7
    bblanchon/ArduinoJson@^7.2.0

; Same firmware plus an on-device test battery that runs at boot and reports
; over USB serial. Not built into the shipping image.
[env:cardputer-selftest]
extends = env:cardputer
build_flags = ${env:cardputer.build_flags} -DSELFTEST=1

; EXPERIMENTAL -- DOES NOT WORK YET. Do not flash this expecting a USB drive.
;
; Intent: present the SD card to the host as mass storage so it mounts in
; Finder over the same cable that powers the device. The code is complete and
; compiles, and the board enumerates as a composite device, but no volume ever
; appears and this build's USB console stays silent, so it cannot be debugged
; from here. See docs/hardware.md "USB mass storage" for what is known.
;
; Two things are certain. Mass storage needs TinyUSB (ARDUINO_USB_MODE=0), and
; in that mode esptool can no longer reset the board on its own -- uploads must
; knock it into the ROM bootloader with a 1200-baud touch first, which
; tools/usb_touch.py does automatically. If that ever fails, hold G0 while
; plugging the cable in.
[env:cardputer-usbdrive]
extends = env:cardputer
build_flags =
    ${env:cardputer.build_flags}
    -DUSB_DRIVE_BUILD=1
build_unflags =
    ${env:cardputer.build_unflags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts = pre:tools/usb_touch.py

; Diagnostic only: formats the SD card at boot and logs every step. Used to find
; out why an on-device format fails, since the format path cannot otherwise be
; triggered without pressing keys.
[env:cardputer-formattest]
extends = env:cardputer
build_flags = ${env:cardputer.build_flags} -DFORMAT_ON_BOOT=1
